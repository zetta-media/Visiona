<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VISIONA - Vision Smart Assistant</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F172A">
  <style>
    :root {
      --bg-color: #0F172A;
      --card-bg: #1E293B;
      --primary: #00E5FF;
      --accent: #FACC15;
      --text: #FFFFFF;
      --text-sub: #94A3B8;
      --danger: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { color: var(--primary); font-size: 1.8rem; margin-bottom: 4px; }
    p.subtitle { color: var(--text-sub); font-size: 0.9rem; }
    
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
    label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--accent); }
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 1rem; margin-bottom: 10px; }
    input[type="text"] { background: #0F172A; color: var(--text); border: 1px solid #475569; }
    select { background: #0F172A; color: var(--text); border: 1px solid #475569; }
    
    .btn-group { display: flex; gap: 8px; }
    .btn-primary { background: var(--primary); color: #000; font-weight: bold; cursor: pointer; }
    .btn-secondary { background: #334155; color: var(--text); font-weight: bold; cursor: pointer; }
    .btn-accent { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; }
    .btn-danger { background: var(--danger); color: #fff; font-weight: bold; cursor: pointer; }

    #camera-preview { width: 100%; height: 260px; object-fit: cover; border-radius: 8px; background: #000; display: block; }
    #result-box { min-height: 80px; font-size: 1.05rem; line-height: 1.5; white-space: pre-wrap; }
    
    .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .controls-row label { margin-bottom: 0; }
    .controls-row input[type="range"] { width: 60%; margin-bottom: 0; }
  </style>
</head>
<body>

  <header>
    <h1>VISIONA</h1>
    <p class="subtitle">Vision Smart Assistant — See More. Understand More.</p>
  </header>

  <!-- Konfigurasi API & Model -->
  <div class="card">
    <label for="api-key">Gemini API Key:</label>
    <input type="text" id="api-key" placeholder="Masukkan AIZA..." onchange="saveApiKey()">
    
    <label for="model-select">Pilih Model Gemini:</label>
    <select id="model-select">
      <option value="gemini-1.5-flash">Gemini 1.5 Flash (Rekomendasi Cepat)</option>
      <option value="gemini-1.5-pro">Gemini 1.5 Pro (Detail Tinggi)</option>
    </select>
    
    <button class="btn-secondary" id="btn-refresh" onclick="fetchModels()">🔄 Refresh Daftar Model</button>
  </div>

  <!-- Kamera & Pengambilan Gambar -->
  <div class="card">
    <video id="camera-preview" autoplay playsinline></video>
    <div class="btn-group" style="margin-top: 10px;">
      <button class="btn-primary" onclick="captureAndAnalyze()">📷 Ambil & Analisis Foto</button>
      <button class="btn-secondary" style="width: auto;" onclick="toggleFlash()" id="btn-flash">🔦</button>
    </div>
  </div>

  <!-- Pengaturan Suara & Kontrol Pembacaan -->
  <div class="card">
    <div class="controls-row" style="margin-bottom: 12px;">
      <label for="speech-rate">Kecepatan Suara:</label>
      <input type="range" id="speech-rate" min="0.5" max="2" step="0.1" value="1" onchange="updateRateLabel(this.value)">
      <span id="rate-val">1x</span>
    </div>

    <div class="btn-group">
      <button class="btn-accent" onclick="speakResult()">🔊 Baca Hasil</button>
      <button class="btn-danger" onclick="stopSpeech()">⏹️ Henti</button>
    </div>
  </div>

  <!-- Hasil Analisis -->
  <div class="card">
    <label>Hasil Analisis Vision:</label>
    <div id="result-box">Silakan masukkan API Key, lalu tekan tombol "Ambil & Analisis Foto".</div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    let streamTrack = null;
    let isFlashOn = false;

    // Inisialisasi awal
    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('VISIONA_API_KEY');
      if (savedKey) {
        document.getElementById('api-key').value = savedKey;
      }
      startCamera();
      registerPWA();
    });

    function saveApiKey() {
      const key = document.getElementById('api-key').value.trim();
      localStorage.setItem('VISIONA_API_KEY', key);
    }

    // Akses Kamera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        const video = document.getElementById('camera-preview');
        video.srcObject = stream;
        streamTrack = stream.getVideoTracks()[0];
      } catch (err) {
        alert('Gagal mengakses kamera: ' + err.message);
      }
    }

    // Toggle Flashlight / Lampu Kilat
    async function toggleFlash() {
      if (!streamTrack) return;
      const capabilities = streamTrack.getCapabilities();
      if (!capabilities.torch) {
        alert('Senter/Torch tidak didukung di perangkat ini.');
        return;
      }
      isFlashOn = !isFlashOn;
      await streamTrack.applyConstraints({ advanced: [{ torch: isFlashOn }] });
      document.getElementById('btn-flash').innerText = isFlashOn ? '🔦 ON' : '🔦 OFF';
    }

    // Fetch daftar model dinamis dari API Gemini
    async function fetchModels() {
      const apiKey = document.getElementById('api-key').value.trim();
      if (!apiKey) return alert('Masukkan API Key terlebih dahulu!');

      const btn = document.getElementById('btn-refresh');
      btn.innerText = 'Mengambil Model...';
      btn.disabled = true;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        if (!res.ok) throw new Error('API Key tidak valid atau kendala jaringan.');
        
        const data = await res.json();
        const geminiModels = data.models.filter(m => m.supportedGenerationMethods.includes('generateContent'));

        const select = document.getElementById('model-select');
        select.innerHTML = '';

        geminiModels.forEach(m => {
          const cleanName = m.name.replace('models/', '');
          const opt = document.createElement('option');
          opt.value = cleanName;
          opt.textContent = `${m.displayName || cleanName} (${cleanName})`;
          select.appendChild(opt);
        });

        speakText("Daftar model berhasil diperbarui.");
        alert('Daftar model berhasil diperbarui!');
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.innerText = '🔄 Refresh Daftar Model';
        btn.disabled = false;
      }
    }

    // Ambil Foto dan Analisis via Gemini API
    async function captureAndAnalyze() {
      const apiKey = document.getElementById('api-key').value.trim();
      if (!apiKey) return alert('Mohon isi API Key Gemini terlebih dahulu!');

      const video = document.getElementById('camera-preview');
      const canvas = document.getElementById('canvas');
      const context = canvas.getContext('2d');

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
      const model = document.getElementById('model-select').value;
      const resultBox = document.getElementById('result-box');

      resultBox.innerText = 'Memproses foto... Mohon tunggu.';
      speakText('Memproses foto.');

      const promptText = "Anda adalah asisten visual untuk tunanetra. Jelaskan gambar ini secara padat, fokus pada teks, nominal uang, warna, atau rintangan utama di depan.";

      try {
        const textResult = await callGeminiApi(model, apiKey, promptText, base64Image);
        resultBox.innerText = textResult;
        speakText(textResult);
      } catch (err) {
        console.warn('Gagal dengan model utama, mencoba fallback...', err);
        // Fallback otomatis ke gemini-1.5-flash jika model pilihan gagal
        try {
          resultBox.innerText = 'Model utama sibuk, beralih ke model alternatif...';
          const fallbackResult = await callGeminiApi('gemini-1.5-flash', apiKey, promptText, base64Image);
          resultBox.innerText = fallbackResult;
          speakText(fallbackResult);
        } catch (fallbackErr) {
          resultBox.innerText = 'Gagal menganalisis gambar. Pastikan koneksi internet lancar dan API Key aktif.';
          speakText('Gagal menganalisis gambar. Silakan coba lagi.');
        }
      }
    }

    // Fungsi Pembantu Panggilan API Gemini
    async function callGeminiApi(modelName, apiKey, prompt, base64Img) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
      const payload = {
        contents: [{
          parts: [
            { text: prompt },
            { inline_data: { mime_type: "image/jpeg", data: base64Img } }
          ]
        }]
      };

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw new Error(`HTTP Error status: ${res.status}`);
      const data = await res.json();
      return data.candidates[0].content.parts[0].text;
    }

    // Fitur Text-To-Speech (Suara)
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'id-ID';
      utterance.rate = parseFloat(document.getElementById('speech-rate').value);

      window.speechSynthesis.speak(utterance);
    }

    function speakResult() {
      const text = document.getElementById('result-box').innerText;
      speakText(text);
    }

    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function updateRateLabel(val) {
      document.getElementById('rate-val').innerText = `${val}x`;
    }

    // Registrasi Service Worker PWA
    function registerPWA() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Registration failed:', err));
      }
    }
  </script>
</body>
</html>
